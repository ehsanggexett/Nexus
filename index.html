<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus1 AI</title>

<style>
:root {
  --bg:#090b12;
  --panel:#101420;
  --panel2:#151b2a;
  --line:#242b3b;
  --text:#f3f4fa;
  --muted:#9aa3b7;
  --accent:#8875ff;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
  height:100vh;
  overflow:hidden;
}
button,textarea { font:inherit; }
button { cursor:pointer; }

.app { display:flex;height:100vh;width:100%; }

.sidebar {
  width:245px;
  flex-shrink:0;
  background:var(--panel);
  border-left:1px solid var(--line);
  padding:18px 13px;
  display:flex;
  flex-direction:column;
  gap:18px;
}
.brand {
  font-size:23px;
  font-weight:800;
  color:#a99cff;
  padding:8px 10px;
  direction:ltr;
  text-align:right;
}
.brand small {
  display:block;
  color:var(--muted);
  font-size:10px;
  font-weight:400;
  margin-top:7px;
}
.side-title { color:var(--muted);font-size:12px;padding:4px 10px; }
.menu { display:flex;flex-direction:column;gap:7px; }
.menu button {
  border:1px solid transparent;
  background:transparent;
  color:#c9cede;
  padding:12px 13px;
  border-radius:11px;
  text-align:right;
}
.menu button:hover,.menu button.active {
  background:var(--panel2);
  border-color:var(--line);
  color:white;
}
.sidebar-footer {
  margin-top:auto;
  color:var(--muted);
  font-size:11px;
  text-align:center;
}
.main {
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  position:relative;
}
.topbar {
  height:62px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  padding:0 22px;
  justify-content:space-between;
}
.topbar strong { font-size:15px; }
.status { font-size:11px;color:#8ed9a8; }

.chat {
  flex:1;
  overflow-y:auto;
  padding:28px 18px 160px;
}
.welcome {
  max-width:760px;
  margin:8vh auto 0;
  text-align:center;
}
.welcome h1 { font-size:30px;margin:0 0 12px; }
.welcome p { color:var(--muted);font-size:14px; }
.tools {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  margin-top:30px;
}
.tool-card {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
  text-align:right;
  color:var(--text);
}
.tool-card:hover { border-color:var(--accent); }
.tool-card b { display:block;margin-bottom:7px; }
.tool-card span { font-size:12px;color:var(--muted); }

.messages {
  max-width:850px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:18px;
}
.message {
  max-width:88%;
  padding:14px 16px;
  border-radius:15px;
  line-height:1.9;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.message.user {
  align-self:flex-start;
  background:#24213c;
  border:1px solid #39325e;
}
.message.assistant {
  align-self:flex-end;
  background:var(--panel);
  border:1px solid var(--line);
}
.message img {
  display:block;
  max-width:min(280px,100%);
  max-height:240px;
  object-fit:contain;
  border-radius:10px;
  margin-top:10px;
}

.composer-wrap {
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:18px;
  background:linear-gradient(transparent,var(--bg) 22%);
}
.composer {
  max-width:850px;
  margin:auto;
  background:var(--panel);
  border:1px solid #30384c;
  border-radius:17px;
  padding:10px;
  display:flex;
  align-items:flex-end;
  gap:8px;
}
.composer textarea {
  flex:1;
  resize:none;
  min-height:44px;
  max-height:150px;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  padding:11px 8px;
  line-height:1.7;
}
.icon-btn,.send-btn {
  height:43px;
  min-width:43px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#1a2030;
  color:#e9e8ff;
}
.icon-btn:hover { border-color:var(--accent); }
.send-btn {
  background:#6e5be8;
  border-color:#6e5be8;
  font-size:18px;
}
.send-btn:disabled { opacity:.5;cursor:not-allowed; }
#imageInput { display:none; }
 .preview {
  max-width:850px;
  margin:0 auto 8px;
  display:none;
  align-items:center;
  gap:10px;
  color:var(--muted);
  font-size:12px;
}
.preview img {
  width:55px;
  height:55px;
  object-fit:cover;
  border-radius:8px;
}
.preview button {
  background:transparent;
  border:0;
  color:#ff9b9b;
  font-size:20px;
}
.hint {
  text-align:center;
  color:#737d91;
  font-size:10px;
  margin-top:9px;
}
.voice-active {
  background:#493d91!important;
  border-color:#a99cff!important;
  box-shadow:0 0 0 2px #8875ff33;
}

@media(max-width:700px) {
  .sidebar { width:64px;padding:12px 6px;align-items:center; }
  .brand { font-size:0;padding:8px 0; }
  .brand:after { content:"N";font-size:23px; }
  .brand small,.side-title,.menu button .label,.sidebar-footer { display:none; }
  .menu { width:100%; }
  .menu button { text-align:center;padding:12px 3px;font-size:18px; }
  .topbar { padding:0 13px; }
  .chat { padding:18px 10px 150px; }
  .welcome { margin-top:7vh; }
  .welcome h1 { font-size:23px; }
  .tools { gap:8px; }
  .tool-card { padding:13px;font-size:13px; }
  .tool-card span { font-size:10px; }
  .composer-wrap { padding:10px 8px; }
  .composer { gap:5px;padding:7px; }
  .icon-btn,.send-btn { min-width:38px;height:40px; }
  .message { max-width:95%;font-size:14px; }
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar">
  <div class="brand">
    Nexus1 AI
    <small>ساخته شده توسط ehsanGGExE</small>
  </div>

  <div class="side-title">منو</div>

  <nav class="menu">
    <button class="active" data-mode="دستیار هوشمند"
      onclick="choose('دستیار هوشمند',this)">
      💬 <span class="label">گفت‌وگوی جدید</span>
    </button>

    <button data-mode="حالت مطالعه"
      onclick="choose('حالت مطالعه',this)">
      📚 <span class="label">حالت مطالعه</span>
    </button>

    <button data-mode="تولید تصویر"
      onclick="choose('تولید تصویر',this)">
      🎨 <span class="label">ابزار تصویر</span>
    </button>

    <button data-mode="برنامه‌نویسی"
      onclick="choose('برنامه‌نویسی',this)">
      💻 <span class="label">برنامه‌نویسی</span>
    </button>
  </nav>

  <div class="sidebar-footer">Nexus1 AI · نسخه آزمایشی</div>
</aside>

<main class="main">

<header class="topbar">
  <strong id="modeTitle">دستیار هوشمند</strong>
  <span class="status">● آماده</span>
</header>

<section class="chat" id="chat">

  <div class="welcome" id="welcome">
    <h1>سلام! به Nexus1 AI خوش آمدی</h1>
    <p>چه کاری می‌خواهی انجام بدهیم؟</p>

    <div class="tools">
      <button class="tool-card" onclick="choose('حالت مطالعه')">
        <b>📚 حالت مطالعه</b>
        <span>یادگیری و توضیح مطالب</span>
      </button>

      <button class="tool-card" onclick="choose('تولید تصویر')">
        <b>🎨 ابزار تصویر</b>
        <span>ارسال تصویر برای تحلیل</span>
      </button>

      <button class="tool-card" onclick="toggleVoiceChat()">
        <b>🔊 گفت‌وگوی صوتی</b>
        <span>صحبت کن و پاسخ را با صدا بشنو</span>
      </button>

      <button class="tool-card" onclick="choose('برنامه‌نویسی')">
        <b>💻 برنامه‌نویسی</b>
        <span>کمک در نوشتن و رفع خطای کد</span>
      </button>
    </div>
  </div>

  <div class="messages" id="messages"></div>
</section>

<div class="composer-wrap">

  <div class="preview" id="imagePreview">
    <img id="previewImage" alt="پیش‌نمایش تصویر">
    <span>تصویر انتخاب شد</span>
    <button onclick="removeImage()" title="حذف تصویر">×</button>
  </div>

  <div class="composer">

    <label class="icon-btn" for="imageInput"
      title="انتخاب تصویر"
      style="display:grid;place-items:center">＋</label>

    <input id="imageInput" type="file"
      accept="image/png,image/jpeg,image/webp,image/gif">

    <button class="icon-btn" id="micButton"
      onclick="startVoice()" title="تبدیل گفتار به متن">🎙️</button>

    <button class="icon-btn" id="voiceChatButton"
      onclick="toggleVoiceChat()" title="شروع گفت‌وگوی صوتی">🔊</button>

    <textarea id="message" rows="1"
      placeholder="پیامت را بنویس..."></textarea>
      <button class="send-btn" id="sendButton"
      onclick="sendMessage()" title="ارسال">➤</button>

  </div>

  <div class="hint">
    Nexus1 AI ممکن است گاهی پاسخ نادرست بدهد؛ اطلاعات مهم را بررسی کن.
  </div>
</div>

</main>
</div>

<script>
"use strict";

let currentMode = "دستیار هوشمند";
let isSending = false;
let selectedImage = null;

let micRecognition = null;
let isMicListening = false;

let voiceChatActive = false;
let voiceTurnRecognition = null;
let isVoiceChatListening = false;
let voiceRestartTimer = null;

const input = document.getElementById("message");
const messages = document.getElementById("messages");
const sendButton = document.getElementById("sendButton");
const imageInput = document.getElementById("imageInput");
const voiceChatButton = document.getElementById("voiceChatButton");

function choose(mode, button) {
  currentMode = mode;
  document.getElementById("modeTitle").textContent = mode;

  document.querySelectorAll(".menu button").forEach(function(item) {
    item.classList.toggle("active", item.dataset.mode === mode);
  });

  if (button && button.dataset && button.dataset.mode) {
    document.querySelectorAll(".menu button").forEach(function(item) {
      item.classList.toggle("active", item === button);
    });
  }

  if (mode === "تولید تصویر") {
    input.placeholder = "درباره تصویر یا تصویری که می‌فرستی توضیح بده...";
  } else if (mode === "حالت مطالعه") {
    input.placeholder = "سؤال درسی‌ات را بنویس...";
  } else if (mode === "برنامه‌نویسی") {
    input.placeholder = "سؤال یا کدت را بنویس...";
  } else {
    input.placeholder = "پیامت را بنویس...";
  }

  input.focus();
}

function getModeInstruction() {
  if (currentMode === "حالت مطالعه") {
    return "در نقش یک معلم صبور و ساده‌گو پاسخ بده. مراحل را روشن توضیح بده.\n\n";
  }

  if (currentMode === "تولید تصویر") {
    return "اگر تصویری فرستاده شده، آن را دقیق تحلیل کن.\n\n";
  }

  if (currentMode === "برنامه‌نویسی") {
    return "در نقش یک دستیار برنامه‌نویسی پاسخ بده و کدها را کامل و قابل کپی ارائه کن.\n\n";
  }

  return "";
}

function addMessage(text, type, imageUrl) {
  const item = document.createElement("div");
  item.className = "message " + type;
  item.textContent = text || (imageUrl ? "این تصویر را بررسی کن." : "");

  if (imageUrl) {
    const img = document.createElement("img");
    img.src = imageUrl;
    img.alt = "تصویر ارسال‌شده";
    item.appendChild(img);
  }

  messages.appendChild(item);

  const chat = document.getElementById("chat");
  chat.scrollTop = chat.scrollHeight;

  return item;
}

/* انتخاب و پیش‌نمایش تصویر */
imageInput.addEventListener("change", function(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  const allowed = [
    "image/jpeg",
    "image/png",
    "image/webp",
    "image/gif"
  ];

  if (!allowed.includes(file.type)) {
    alert("لطفاً تصویر با فرمت JPG، PNG، WEBP یا GIF انتخاب کن.");
    imageInput.value = "";
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    alert("حجم تصویر باید کمتر از ۵ مگابایت باشد.");
    imageInput.value = "";
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e) {
    selectedImage = {
      mimeType: file.type,
      data: e.target.result
    };

    document.getElementById("previewImage").src = e.target.result;
    document.getElementById("imagePreview").style.display = "flex";
  };

  reader.readAsDataURL(file);
});

function removeImage() {
  selectedImage = null;
  imageInput.value = "";

  document.getElementById("imagePreview").style.display = "none";
  document.getElementById("previewImage").removeAttribute("src");
}

function extractReply(data) {
  if (typeof data === "string") return data;

  return data.reply ||
    data.text ||
    data.response ||
    data.message ||
    data.output ||
    "پاسخی از سرور دریافت نشد.";
}

/* ارسال پیام به سرور */
async function sendMessage(options) {
  options = options || {};

  const userMessage = input.value.trim();

  if ((!userMessage && !selectedImage) || isSending) return;

  isSending = true;
  sendButton.disabled = true;
 const imageForRequest = selectedImage;
  const imageForDisplay = imageForRequest
    ? imageForRequest.data
    : null;

  addMessage(userMessage, "user", imageForDisplay);

  input.value = "";
  input.style.height = "44px";

  removeImage();

  document.getElementById("welcome").style.display = "none";

  const waiting = addMessage("در حال دریافت پاسخ...", "assistant");

  try {
    const payload = {
      message: getModeInstruction() + userMessage,
      image: imageForRequest ? {
        mimeType: imageForRequest.mimeType,
        data: imageForRequest.data
      } : null
    };

    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    });

    let data;

    try {
      data = await response.json();
    } catch (_) {
      throw new Error("پاسخ سرور قابل خواندن نیست.");
    }

    if (!response.ok) {
      throw new Error(
        data.error ||
        data.message ||
        ("خطای سرور: " + response.status)
      );
    }

    const reply = extractReply(data);
    waiting.textContent = reply;

    if (options.fromVoice && voiceChatActive) {
      speakVoiceReply(reply);
    }

  } catch (error) {
    waiting.textContent =
      "ارتباط با هوش مصنوعی با مشکل مواجه شد: " + error.message;

    if (options.fromVoice && voiceChatActive) {
      scheduleVoiceListen(1800);
    }

  } finally {
    isSending = false;
    sendButton.disabled = false;

    if (voiceChatActive && !options.fromVoice) {
      scheduleVoiceListen(700);
    }
  }
}

/* میکروفون معمولی؛ تبدیل صدا به متن */
function startVoice() {
  if (voiceChatActive) {
    stopVoiceChat();
  }

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("مرورگر شما از تبدیل گفتار به متن پشتیبانی نمی‌کند. از Chrome استفاده کن.");
    return;
  }

  if (isMicListening) {
    try {
      micRecognition.stop();
    } catch (_) {}
    return;
  }

  micRecognition = new SpeechRecognition();
  micRecognition.lang = "fa-IR";
  micRecognition.continuous = false;
  micRecognition.interimResults = false;

  isMicListening = true;
  document.getElementById("micButton").classList.add("voice-active");

  micRecognition.onresult = function(event) {
    const transcript = event.results[0][0].transcript;
    input.value = (input.value + " " + transcript).trim();
    sendMessage();
  };

  micRecognition.onerror = function() {
    isMicListening = false;
    document.getElementById("micButton").classList.remove("voice-active");
  };

  micRecognition.onend = function() {
    isMicListening = false;
    document.getElementById("micButton").classList.remove("voice-active");
  };

  try {
    micRecognition.start();
  } catch (_) {
    isMicListening = false;
    document.getElementById("micButton").classList.remove("voice-active");
    alert("میکروفون شروع نشد. مجوز میکروفون مرورگر را بررسی کن.");
  }
}

/* شروع و توقف گفت‌وگوی صوتی دوطرفه */
function toggleVoiceChat() {
  if (voiceChatActive) {
    stopVoiceChat();
    return;
  }

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition || !("speechSynthesis" in window)) {
    alert("گفت‌وگوی صوتی در این مرورگر پشتیبانی نمی‌شود. آخرین نسخه Chrome را امتحان کن.");
    return;
  }

  if (isMicListening && micRecognition) {
    try {
      micRecognition.abort();
    } catch (_) {}
    isMicListening = false;
  }

  voiceChatActive = true;

  voiceChatButton.classList.add("voice-active");
  voiceChatButton.textContent = "⏹";
  voiceChatButton.title = "توقف گفت‌وگوی صوتی";

  listenForVoiceTurn();
}

function stopVoiceChat() {
  voiceChatActive = false;

  clearTimeout(voiceRestartTimer);

  if (voiceTurnRecognition) {
    try {
      voiceTurnRecognition.abort();
    } catch (_) {}
  }

  if (micRecognition && isMicListening) {
    try {
      micRecognition.abort();
    } catch (_) {}
  }

  isVoiceChatListening = false;
  isMicListening = false;
 window.speechSynthesis.cancel();

  voiceChatButton.classList.remove("voice-active");
  voiceChatButton.textContent = "🔊";
  voiceChatButton.title = "شروع گفت‌وگوی صوتی";

  document.getElementById("micButton").classList.remove("voice-active");
}

function scheduleVoiceListen(delay) {
  clearTimeout(voiceRestartTimer);

  if (!voiceChatActive) return;

  voiceRestartTimer = setTimeout(function() {
    if (
      voiceChatActive &&
      !isSending &&
      !isVoiceChatListening &&
      !window.speechSynthesis.speaking
    ) {
      listenForVoiceTurn();
    }
  }, delay);
}

/* شنیدن صحبت کاربر در حالت مکالمه */
function listenForVoiceTurn() {
  if (
    !voiceChatActive ||
    isSending ||
    isVoiceChatListening ||
    window.speechSynthesis.speaking
  ) {
    return;
  }

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) return;

  voiceTurnRecognition = new SpeechRecognition();
  voiceTurnRecognition.lang = "fa-IR";
  voiceTurnRecognition.continuous = false;
  voiceTurnRecognition.interimResults = false;

  isVoiceChatListening = true;

  voiceTurnRecognition.onresult = function(event) {
    const transcript =
      event.results &&
      event.results[0] &&
      event.results[0][0]
        ? event.results[0][0].transcript.trim()
        : "";

    isVoiceChatListening = false;

    if (transcript && voiceChatActive) {
      input.value = transcript;
      sendMessage({ fromVoice: true });
    }
  };

  voiceTurnRecognition.onerror = function(event) {
    isVoiceChatListening = false;

    if (
      event.error === "not-allowed" ||
      event.error === "service-not-allowed"
    ) {
      stopVoiceChat();
      alert("اجازه دسترسی به میکروفون داده نشده است.");
    }
  };

  voiceTurnRecognition.onend = function() {
    isVoiceChatListening = false;

    if (
      voiceChatActive &&
      !isSending &&
      !window.speechSynthesis.speaking
    ) {
      scheduleVoiceListen(500);
    }
  };

  try {
    voiceTurnRecognition.start();
  } catch (_) {
    isVoiceChatListening = false;
    scheduleVoiceListen(1200);
  }
}

/* خواندن پاسخ هوش مصنوعی با صدا */
function speakVoiceReply(text) {
  if (!voiceChatActive || !text) return;

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);

  utterance.lang = "fa-IR";
  utterance.rate = 1;
  utterance.pitch = 1;

  utterance.onend = function() {
    if (voiceChatActive) {
      scheduleVoiceListen(500);
    }
  };

  utterance.onerror = function() {
    if (voiceChatActive) {
      scheduleVoiceListen(1000);
    }
  };

  window.speechSynthesis.speak(utterance);
}

/* ارسال با Enter و تنظیم ارتفاع کادر */
input.addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

input.addEventListener("input", function() {
  input.style.height = "44px";
  input.style.height =
    Math.min(input.scrollHeight, 150) + "px";
});
</script>

</body>
</html>

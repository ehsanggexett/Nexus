<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b10">
  <title>Nexus1 AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #090b10;
      color: #f4f4f7;
      min-height: 100vh;
    }

    button, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 245px;
      background: #10131c;
      border-left: 1px solid #242735;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
      color: #9a8cff;
      padding: 10px;
      margin-bottom: 18px;
    }

    .creator {
      color: #777d91;
      font-size: 11px;
      margin-right: 10px;
      margin-top: -25px;
      margin-bottom: 20px;
    }

    .menu-btn {
      width: 100%;
      border: 1px solid transparent;
      color: #c6c8d3;
      background: transparent;
      padding: 13px;
      border-radius: 12px;
      text-align: right;
      transition: .2s;
    }

    .menu-btn:hover,
    .menu-btn.active {
      background: #1c2030;
      border-color: #38334f;
      color: white;
    }

    .sidebar-bottom {
      margin-top: auto;
      color: #73798d;
      font-size: 12px;
      padding: 10px;
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topbar {
      height: 65px;
      border-bottom: 1px solid #202330;
      display: flex;
      align-items: center;
      padding: 0 22px;
      justify-content: space-between;
    }

    .top-title {
      font-size: 15px;
      font-weight: bold;
    }

    .status {
      color: #72dba3;
      font-size: 12px;
    }

    .messages {
      flex: 1;
      width: 100%;
      max-width: 950px;
      margin: auto;
      padding: 28px 22px 150px;
    }

    .welcome {
      text-align: center;
      padding: 90px 10px 40px;
    }

    .welcome h1 {
      font-size: 32px;
      color: #a092ff;
      margin-bottom: 12px;
    }

    .welcome p {
      color: #9297a9;
      line-height: 2;
    }

    .message {
      display: flex;
      margin: 20px 0;
      gap: 10px;
      align-items: flex-start;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 35px;
      height: 35px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: #242139;
      color: #b4a8ff;
      flex-shrink: 0;
      font-size: 13px;
    }

    .user .avatar {
      background: #26384a;
      color: #9ed4ff;
    }

    .bubble {
      max-width: 82%;
      background: #151925;
      border: 1px solid #282d3c;
      border-radius: 15px;
      padding: 13px 16px;
      line-height: 2;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: #24213a;
      border-color: #393252;
    }

    .bubble a {
      color: #a99bff;
      text-decoration: underline;
      word-break: break-word;
    }

    .bubble a:hover {
      color: #d0c8ff;
    }

    .sources {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #34394a;
    }

    .sources-title {
      color: #aaa1ff;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .source-item {
      display: block;
      padding: 9px 11px;
      margin-top: 7px;
      border: 1px solid #30354a;
      background: #101522;
      border-radius: 9px;
      color: #c7c4ff;
      text-decoration: none;
      font-size: 13px;
      line-height: 1.8;
    }

    .source-item:hover {
      background: #20243a;
      border-color: #7770bb;
    }
    .source-url {
      display: block;
      color: #858ba0;
      font-size: 10px;
      direction: ltr;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .composer-wrap {
      position: fixed;
      bottom: 0;
      right: 245px;
      left: 0;
      padding: 18px 22px 22px;
      background: linear-gradient(transparent, #090b10 22%);
    }

    .composer {
      max-width: 850px;
      margin: auto;
      background: #151925;
      border: 1px solid #34394b;
      border-radius: 17px;
      padding: 12px;
    }

    .composer textarea {
      width: 100%;
      min-height: 55px;
      max-height: 170px;
      resize: vertical;
      border: none;
      outline: none;
      color: white;
      background: transparent;
      padding: 8px;
      line-height: 1.8;
    }

    .composer textarea::placeholder {
      color: #777e92;
    }

    .tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      border-top: 1px solid #292e3d;
      padding-top: 10px;
    }

    .tool-btn {
      border: 1px solid #34394b;
      background: #202536;
      color: #c5c8d6;
      padding: 9px 12px;
      border-radius: 9px;
      font-size: 12px;
    }

    .tool-btn:hover {
      background: #303650;
    }

    .send-btn {
      margin-right: auto;
      background: #7968df;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 19px;
      font-weight: bold;
    }

    .send-btn:hover {
      background: #9182f2;
    }

    .send-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .image-preview {
      display: none;
      padding: 10px 5px;
    }

    .image-preview img {
      max-width: 120px;
      max-height: 100px;
      border-radius: 10px;
      border: 1px solid #48415f;
    }

    .image-preview button {
      display: block;
      margin-top: 5px;
      background: #492b38;
      border: none;
      color: white;
      border-radius: 7px;
      padding: 5px 9px;
    }

    .message-image {
      display: block;
      max-width: 250px;
      max-height: 250px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .mode-label {
      color: #a89cff;
      font-size: 12px;
      margin-right: 5px;
    }

    @media (max-width: 760px) {
      .sidebar {
        width: 65px;
        padding: 12px 6px;
      }

      .logo {
        font-size: 12px;
        padding: 8px 2px;
        text-align: center;
      }

      .creator {
        display: none;
      }

      .menu-btn {
        font-size: 0;
        text-align: center;
        padding: 13px 2px;
      }

      .menu-btn::first-letter {
        font-size: 18px;
      }

      .sidebar-bottom {
        display: none;
      }

      .composer-wrap {
        right: 65px;
        padding: 10px;
      }

      .messages {
        padding: 20px 12px 180px;
      }

      .welcome {
        padding-top: 65px;
      }

      .welcome h1 {
        font-size: 25px;
      }

      .bubble {
        max-width: 90%;
        font-size: 13px;
      }

      .topbar {
        padding: 0 12px;
      }

      .tool-btn {
        padding: 8px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
<div class="app">

  <aside class="sidebar">
    <div class="logo">✦ Nexus1 AI</div>
    <div class="creator">Created by ehsanGGExE</div>

    <button class="menu-btn active" data-mode="chat" onclick="setMode('chat', this)">💬 چت هوشمند</button>
    <button class="menu-btn" data-mode="study" onclick="setMode('study', this)">📚 حالت مطالعه</button>
    <button class="menu-btn" data-mode="image" onclick="setMode('image', this)">🎨 تولید تصویر</button>
    <button class="menu-btn" data-mode="code" onclick="setMode('code', this)">💻 برنامه‌نویسی</button>

    <div class="sidebar-bottom">
      Nexus1 AI<br>
      هوش مصنوعی چندمنظوره
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-title">Nexus1 AI</div>
      <div class="status">● آنلاین</div>
    </header>
    <section class="messages" id="messages">
      <div class="welcome" id="welcome">
        <h1>سلام! من Nexus1 AI هستم ✦</h1>
        <p>
          چطور می‌تونم کمکت کنم؟<br>
          سؤال بپرس، عکس بفرست یا از من بخواه در اینترنت جست‌وجو کنم.
        </p>
      </div>
    </section>
  </main>
</div>

<div class="composer-wrap">
  <div class="composer">

    <div class="image-preview" id="imagePreview">
      <img id="previewImage" alt="پیش‌نمایش تصویر">
      <button type="button" onclick="removeImage()">حذف تصویر ×</button>
    </div>

    <textarea
      id="messageInput"
      placeholder="پیامت رو برای Nexus1 AI بنویس..."
      onkeydown="handleEnter(event)"
    ></textarea>

    <div class="tools">
      <input
        type="file"
        id="imageInput"
        accept="image/jpeg,image/png,image/webp,image/gif"
        hidden
        onchange="handleImage(event)"
      >

      <button class="tool-btn" onclick="document.getElementById('imageInput').click()">🖼 عکس</button>
      <button class="tool-btn" onclick="startVoice()">🎤 میکروفون</button>
      <button class="tool-btn" id="voiceChatButton" onclick="toggleVoiceChat()">🔊 گفت‌وگوی صوتی</button>
      <button class="tool-btn" onclick="insertSearch()">🌐 جست‌وجوی وب</button>
      <span class="mode-label" id="modeLabel">حالت چت</span>
      <button class="send-btn" id="sendButton" onclick="sendMessage()">ارسال ↑</button>
    </div>
  </div>
</div>

<script>
  let currentMode = "chat";
  let selectedImage = null;
  let recognition = null;
  let voiceChatActive = false;
  let isSpeaking = false;

  const messages = document.getElementById("messages");
  const input = document.getElementById("messageInput");
  const sendButton = document.getElementById("sendButton");

  function setMode(mode, button) {
    currentMode = mode;

    document.querySelectorAll(".menu-btn").forEach(btn => {
      btn.classList.remove("active");
    });

    if (button) button.classList.add("active");

    const labels = {
      chat: "حالت چت",
      study: "حالت مطالعه",
      image: "حالت تولید تصویر",
      code: "حالت برنامه‌نویسی"
    };

    document.getElementById("modeLabel").textContent = labels[mode];

    const placeholders = {
      chat: "پیامت رو برای Nexus1 AI بنویس...",
      study: "سؤال درسی‌ات رو بنویس...",
      image: "توضیح بده چه تصویری می‌خوای...",
      code: "سؤال یا کدت رو اینجا بنویس..."
    };

    input.placeholder = placeholders[mode];

    const prompts = {
      chat: "",
      study: "در حالت مطالعه، این درخواست را مرحله‌به‌مرحله و ساده توضیح بده:\n",
      image: "درخواست من درباره تولید تصویر است. اگر امکان تولید تصویر در این نسخه فعال نیست، صادقانه توضیح بده:\n",
      code: "در نقش دستیار برنامه‌نویسی، ساده و مرحله‌به‌مرحله کمکم کن:\n"
    };

    input.dataset.prefix = prompts[mode];
  }

  function insertSearch() {
    input.value = "در اینترنت جست‌وجو کن و لینک منابع معتبر را هم بده: ";
    input.focus();
  }

  function hideWelcome() {
    const welcome = document.getElementById("welcome");
    if (welcome) welcome.remove();
  }

  function addMessage(role, text, imageData = null, sources = []) {
    hideWelcome();

    const row = document.createElement("div");
    row.className = "message " + role;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "شما" : "AI";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    // متن پاسخ با حفظ امنیت نمایش داده می‌شود
    bubble.textContent = text || "";

    if (imageData) {
      const img = document.createElement("img");
      img.src = imageData;
      img.className = "message-image";
      img.alt = "تصویر ارسال‌شده";
      bubble.appendChild(img);
    }

    if (role === "assistant" && sources.length) {
      const sourceBox = document.createElement("div");
      sourceBox.className = "sources";

      const title = document.createElement("div");
      title.className = "sources-title";
      title.textContent = "🌐 منابع پیدا شده در اینترنت";
      sourceBox.appendChild(title);
      sources.forEach(source => {
        try {
          const url = new URL(source.url);

          if (!["http:", "https:"].includes(url.protocol)) return;

          const link = document.createElement("a");
          link.className = "source-item";
          link.href = url.href;
          link.target = "_blank";
          link.rel = "noopener noreferrer";

          const name = document.createElement("span");
          name.textContent = source.title || "مشاهده منبع";

          const address = document.createElement("span");
          address.className = "source-url";
          address.textContent = url.hostname;

          link.appendChild(name);
          link.appendChild(address);
          sourceBox.appendChild(link);
        } catch {
          // لینک نامعتبر نمایش داده نمی‌شود
        }
      });

      bubble.appendChild(sourceBox);
    }

    row.appendChild(avatar);
    row.appendChild(bubble);
    messages.appendChild(row);

    window.scrollTo({
      top: document.body.scrollHeight,
      behavior: "smooth"
    });

    return bubble;
  }

  function handleImage(event) {
    const file = event.target.files[0];
    if (!file) return;

    const allowed = [
      "image/jpeg",
      "image/png",
      "image/webp",
      "image/gif"
    ];

    if (!allowed.includes(file.type)) {
      alert("فرمت تصویر پشتیبانی نمی‌شود.");
      event.target.value = "";
      return;
    }

    if (file.size > 5 * 1024 * 1024) {
      alert("حجم تصویر باید حداکثر ۵ مگابایت باشد.");
      event.target.value = "";
      return;
    }

    const reader = new FileReader();

    reader.onload = () => {
      selectedImage = {
        mimeType: file.type,
        data: reader.result.split(",")[1],
        preview: reader.result
      };

      document.getElementById("previewImage").src = reader.result;
      document.getElementById("imagePreview").style.display = "block";
    };

    reader.readAsDataURL(file);
  }

  function removeImage() {
    selectedImage = null;
    document.getElementById("imageInput").value = "";
    document.getElementById("imagePreview").style.display = "none";
  }

  function handleEnter(event) {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  }

  async function sendMessage() {
    let message = input.value.trim();
    const image = selectedImage;

    if (!message && !image) return;

    if (input.dataset.prefix) {
      message = input.dataset.prefix + message;
    }

    const preview = image ? image.preview : null;

    addMessage("user", message || "لطفاً این تصویر را بررسی کن.", preview);

    input.value = "";
    removeImage();

    const waiting = addMessage("assistant", "در حال فکر کردن...");

    sendButton.disabled = true;

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message,
          image: image ? {
            mimeType: image.mimeType,
            data: image.data
          } : null
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "ارتباط با هوش مصنوعی با مشکل مواجه شد.");
      }

      waiting.textContent = data.reply || "پاسخی دریافت نشد.";

      // نمایش لینک‌های جست‌وجوی واقعی برگشتی از سرور
      if (Array.isArray(data.sources) && data.sources.length) {
        const sourceBox = document.createElement("div");
        sourceBox.className = "sources";

        const title = document.createElement("div");
        title.className = "sources-title";
        title.textContent = "🌐 منابع جست‌وجو";
        sourceBox.appendChild(title);

        data.sources.forEach(source => {
          try {
            const url = new URL(source.url);

            if (!["https:", "http:"].includes(url.protocol)) return;
            const link = document.createElement("a");
            link.className = "source-item";
            link.href = url.href;
            link.target = "_blank";
            link.rel = "noopener noreferrer";

            const name = document.createElement("span");
            name.textContent = source.title || "مشاهده نتیجه";

            const host = document.createElement("span");
            host.className = "source-url";
            host.textContent = url.hostname;

            link.append(name, host);
            sourceBox.appendChild(link);
          } catch {
            // لینک نامعتبر نادیده گرفته می‌شود
          }
        });

        waiting.appendChild(sourceBox);
      }

      if (voiceChatActive) {
        speakVoiceReply(data.reply || "");
      }

    } catch (error) {
      waiting.textContent = "خطا: " + error.message;
    } finally {
      sendButton.disabled = false;
      input.focus();
    }
  }

  function getSpeechRecognition() {
    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("مرورگر شما از تشخیص گفتار پشتیبانی نمی‌کند.");
      return null;
    }

    const rec = new SpeechRecognition();
    rec.lang = "fa-IR";
    rec.interimResults = false;
    rec.continuous = false;

    return rec;
  }

  function startVoice() {
    const rec = getSpeechRecognition();
    if (!rec) return;

    recognition = rec;

    rec.onresult = event => {
      const text = event.results[0][0].transcript;
      input.value = (input.value + " " + text).trim();
      input.focus();
    };

    rec.onerror = () => {
      console.log("Speech recognition error");
    };

    rec.start();
  }

  function toggleVoiceChat() {
    if (voiceChatActive) {
      stopVoiceChat();
      return;
    }

    const rec = getSpeechRecognition();
    if (!rec) return;

    voiceChatActive = true;
    recognition = rec;

    document.getElementById("voiceChatButton").textContent =
      "⏹ توقف گفت‌وگوی صوتی";

    listenForVoiceTurn();
  }

  function stopVoiceChat() {
    voiceChatActive = false;
    isSpeaking = false;

    if (recognition) {
      try {
        recognition.abort();
      } catch {}
    }

    window.speechSynthesis.cancel();

    document.getElementById("voiceChatButton").textContent =
      "🔊 گفت‌وگوی صوتی";
  }

  function listenForVoiceTurn() {
    if (!voiceChatActive || isSpeaking) return;

    const rec = getSpeechRecognition();
    if (!rec) {
      stopVoiceChat();
      return;
    }

    recognition = rec;

    rec.onresult = async event => {
      const spokenText = event.results[0][0].transcript;
      input.value = spokenText;
      await sendMessage();
    };

    rec.onerror = () => {
      if (voiceChatActive && !isSpeaking) {
        stopVoiceChat();
      }
    };

    rec.onend = () => {
      if (voiceChatActive && !isSpeaking) {
        // شروع دوباره شنیدن در صورت پایان طبیعی
        setTimeout(() => {
          if (voiceChatActive && !isSpeaking) {
            listenForVoiceTurn();
          }
        }, 500);
      }
    };

    try {
      rec.start();
    } catch {
      stopVoiceChat();
    }
  }

  function speakVoiceReply(text) {
    if (!voiceChatActive || !("speechSynthesis" in window)) return;

    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "fa-IR";
    utterance.rate = 1;
    utterance.pitch = 1;

    isSpeaking = true;

    utterance.onend = () => {
      isSpeaking = false;

      if (voiceChatActive) {
        listenForVoiceTurn();
      }
    };

    utterance.onerror = () => {
      isSpeaking = false;

      if (voiceChatActive) {
        listenForVoiceTurn();
      }
    };

    window.speechSynthesis.speak(utterance);
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101c2b">
<meta name="description" content="Nexus1 AI - دستیار هوشمند شما">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Nexus1 AI</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

:root{
 --bg:#0b1420;
 --panel:#111f30;
 --panel2:#17283b;
 --gold:#e6b653;
 --gold2:#f5cf79;
 --cyan:#39cbbd;
 --text:#e7edf2;
 --muted:#91a2b4;
 --line:#34475b;
}
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 background:
 radial-gradient(ellipse at 50% -15%,#24465b 0%,transparent 50%),
 linear-gradient(145deg,#09131f,#101c2b 55%,#0b1723);
 color:var(--text);
 font-family:Vazirmatn,Tahoma,sans-serif;
}
button,input,textarea{font:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.5;cursor:wait}
button:focus-visible,input:focus-visible,textarea:focus-visible{
 outline:2px solid var(--cyan);
 outline-offset:2px;
}
.app{
 display:grid;
 grid-template-columns:260px minmax(0,1fr) 245px;
 gap:15px;
 padding:15px;
 min-height:100vh;
}
.panel,.topbar,.composer,.card,.toolcard{
 background:#111f30eF;
 border:1px solid var(--line);
 box-shadow:0 12px 35px #0003;
}
.panel{
 border-radius:19px;
 padding:16px;
 display:flex;
 flex-direction:column;
 gap:13px;
 min-height:calc(100vh - 30px);
}
.brand{
 display:flex;
 align-items:center;
 gap:12px;
 padding-bottom:16px;
 border-bottom:1px solid var(--line);
}
.logo{
 width:48px;
 height:48px;
 border-radius:15px;
 display:grid;
 place-items:center;
 background:linear-gradient(145deg,#f5d17c,#b77c24);
 color:#172332;
 font-size:27px;
 font-weight:900;
 box-shadow:0 5px 20px #e6b65344;
}
.brand strong{font-size:21px;color:var(--gold2)}
.brand small{display:block;color:var(--muted);font-size:10px}
.gold{
 border:0;
 border-radius:12px;
 padding:12px 16px;
 color:#172332;
 font-weight:800;
 background:linear-gradient(120deg,#f5d17c,#d49a35);
 box-shadow:0 5px 18px #d49a3530;
}
.gold:hover{filter:brightness(1.08)}
.secondary{
 border:1px solid var(--line);
 background:#1a2c40;
 border-radius:11px;
 padding:9px 12px;
 color:var(--text);
}
.search{
 width:100%;
 background:#0b1725;
 border:1px solid var(--line);
 border-radius:11px;
 padding:11px;
 color:var(--text);
 outline:none;
}
.history{
 display:flex;
 flex-direction:column;
 gap:7px;
 overflow:auto;
 max-height:55vh;
}
.hist{
 display:flex;
 align-items:center;
 gap:5px;
 padding:7px;
 background:#192a3d;
 border-radius:10px;
}
.hist button{
 background:none;
 border:0;
 color:var(--text);
}
.hist .open{
 flex:1;
 text-align:right;
 overflow:hidden;
 white-space:nowrap;
 text-overflow:ellipsis;
 font-size:12px;
}
.main{
 min-width:0;
 display:flex;
 flex-direction:column;
 gap:13px;
}
.topbar{
 min-height:58px;
 border-radius:16px;
 padding:8px 13px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.status{color:var(--cyan);font-size:12px}
.hero{
 min-height:245px;
 border:1px solid #52677c;
 border-radius:20px;
 padding:30px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 background:
 radial-gradient(circle at 20% 50%,#1b4c59 0%,transparent 38%),
 linear-gradient(120deg,#142b3b,#172638 55%,#273d4c);
 overflow:hidden;
}
.hero h1{
 font-size:clamp(35px,5vw,62px);
 margin:8px 0;
 line-height:1.25;
 color:var(--gold2);
}
.hero p{color:#b7c8d5;line-height:2}
.hero-symbol{
 font-size:clamp(75px,12vw,140px);
 color:var(--gold);
 text-shadow:0 0 45px #e6b65355;
}
.tiles{
 display:grid;
 grid-template-columns:repeat(4,minmax(0,1fr));
 gap:9px;
}
.tile{
 background:#17283b;
  border:1px solid #344b60;
 color:var(--text);
 border-radius:14px;
 padding:13px 5px;
 min-height:83px;
 font-size:12px;
}
.tile .ico{
 display:block;
 font-size:24px;
 margin-bottom:6px;
}
.tile.active{
 background:#49391e;
 border-color:var(--gold);
 color:var(--gold2);
}
.messages{
 min-height:100px;
 max-height:40vh;
 overflow:auto;
 padding:5px;
}
.hint{
 text-align:center;
 color:var(--muted);
 padding:25px 10px;
}
.msg{
 display:flex;
 gap:9px;
 margin:12px 0;
}
.msg.user{flex-direction:row-reverse}
.avatar{
 width:36px;
 height:36px;
 flex:none;
 display:grid;
 place-items:center;
 border-radius:12px;
 background:#244052;
 color:var(--cyan);
}
.msg.user .avatar{
 background:#60491f;
 color:var(--gold2);
}
.bubble{
 max-width:88%;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
 line-height:1.9;
 padding:12px;
 border-radius:14px;
 background:#17283b;
 border:1px solid #34475b;
}
.msg.user .bubble{background:#26374a}
.bubble img{
 display:block;
 max-width:min(240px,65vw);
 max-height:210px;
 border-radius:10px;
 margin-top:8px;
}
.sources{
 border-top:1px solid var(--line);
 margin-top:9px;
 padding-top:8px;
}
.sources a{
 display:block;
 color:var(--cyan);
 font-size:12px;
 margin:5px;
}
.composer{
 border-radius:17px;
 padding:12px;
 position:sticky;
 bottom:8px;
 z-index:3;
}
textarea{
 width:100%;
 min-height:65px;
 max-height:150px;
 resize:vertical;
 background:transparent;
 border:0;
 outline:0;
 padding:9px;
 color:var(--text);
 line-height:1.9;
}
textarea::placeholder{color:#8497a9}
.bar{
 border-top:1px solid var(--line);
 padding-top:10px;
 display:flex;
 flex-wrap:wrap;
 align-items:center;
 gap:7px;
}
.send{margin-right:auto}
.preview{display:none;padding:6px}
.preview img{
 width:75px;
 height:55px;
 object-fit:cover;
 border-radius:9px;
}
.toolcard{
 width:100%;
 border-radius:13px;
 padding:12px;
 display:flex;
 align-items:center;
 gap:10px;
 color:var(--text);
 text-align:right;
}
.toolcard .ico{font-size:23px;color:var(--gold)}
.toolcard b{display:block;font-size:12px}
.toolcard small{display:block;color:var(--muted);font-size:10px}
.mobile{display:none}
#installBtn{display:none}
.foot{
 text-align:center;
 color:var(--muted);
 font-size:11px;
 margin-top:auto;
}
@media(max-width:1050px){
 .app{grid-template-columns:230px minmax(0,1fr)}
 .right{display:none}
}
@media(max-width:700px){
 .app{display:flex;flex-direction:column;padding:7px;gap:9px}
 .panel.left{
  display:none;
  position:fixed;
  z-index:20;
  top:5px;
  bottom:5px;
  right:5px;
  width:min(290px,88vw);
  min-height:0;
  overflow:auto;
  box-shadow:0 0 0 100vmax #000b;
 }
 .panel.left.open{display:flex}
 .mobile{display:inline-block}
 .topbar{min-height:52px}
 .hero{min-height:210px;padding:17px}
 .hero-symbol{font-size:75px}
 .hero h1{font-size:37px}
 .hero p{font-size:12px}
 .tiles{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
 .tile{min-height:72px;font-size:10px}
 .tile .ico{font-size:21px}
 .messages{max-height:37vh}
 .composer{
  position:sticky;
  bottom:calc(5px + env(safe-area-inset-bottom));
  padding:9px;
 }
 textarea{font-size:16px;min-height:58px}
 .secondary{padding:8px;font-size:11px}
 .gold{padding:10px 12px}
 .bubble{max-width:calc(100vw - 75px)}
}
@media(max-width:370px){
 .tiles{grid-template-columns:repeat(3,1fr)}
 .hero-symbol{display:none}
}
</style>
</head>

<body>
<div class="app">

<aside class="panel left" id="sidebar">
 <div class="brand">
  <div class="logo">N</div>
  <div><strong>Nexus1 AI</strong><small>SMART AI ASSISTANT</small></div>
 </div>

 <button class="gold" onclick="newChat()">＋ چت جدید</button>
 <b>◷ تاریخچه گفتگوها</b>
 <input class="search" id="historySearch" placeholder="جست‌وجوی گفتگو..." oninput="drawHistory()">
 <div class="history" id="history"></div>

 <div class="foot">Nexus1 AI · Created by Ehsan</div>
</aside>

<main class="main">
  <header class="topbar">
 <div style="display:flex;align-items:center;gap:10px">
  <button class="secondary mobile" onclick="toggleMenu()">☰</button>
  <span class="status">● آماده به کار</span>
 </div>
 <div style="display:flex;gap:7px">
  <button class="secondary" id="installBtn" onclick="installApp()">＋ نصب برنامه</button>
  <button class="secondary" onclick="fullScreen()">⛶</button>
 </div>
</header>

<section class="hero" id="hero">
 <div>
  <span style="color:var(--cyan)">WELCOME TO NEXUS</span>
  <h1>Nexus1 AI</h1>
  <p>دستیار هوشمند تو برای یادگیری، خلاقیت و برنامه‌نویسی.</p>
  <p>امروز چه کاری انجام بدیم؟</p>
 </div>
 <div class="hero-symbol">N</div>
</section>

<section class="tiles">
 <button class="tile active" data-mode="chat" onclick="setMode('chat')"><span class="ico">💬</span>چت هوشمند</button>
 <button class="tile" data-mode="study" onclick="setMode('study')"><span class="ico">📚</span>مطالعه</button>
 <button class="tile" data-mode="image" onclick="setMode('image')"><span class="ico">🎨</span>تصویر</button>
 <button class="tile" data-mode="code" onclick="setMode('code')"><span class="ico">⌨️</span>برنامه‌نویسی</button>
 <button class="tile" data-mode="web" onclick="webSearch()"><span class="ico">🌐</span>جست‌وجوی وب</button>
 <button class="tile" onclick="voice()"><span class="ico">🎙️</span>میکروفون</button>
 <button class="tile" onclick="document.getElementById('textFile').click()"><span class="ico">📄</span>فایل متنی</button>
 <button class="tile" onclick="document.getElementById('message').focus()"><span class="ico">✍️</span>نوشتن پیام</button>
</section>

<section class="messages" id="messages">
 <div class="hint" id="hint">گفتگوی جدید را شروع کن ✨</div>
</section>

<section class="composer">
 <div class="preview" id="preview">
  <img id="previewImg" alt="پیش‌نمایش عکس">
  <button class="secondary" onclick="removeImage()">حذف عکس ×</button>
 </div>

 <textarea id="message" placeholder="پیامت رو برای Nexus1 AI بنویس..." onkeydown="enterSend(event)"></textarea>

 <div class="bar">
  <input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp" hidden onchange="pickImage(event)">
  <input id="textFile" type="file" accept=".txt,.md,.csv" hidden onchange="pickTextFile(event)">
  <button class="secondary" onclick="document.getElementById('imageFile').click()">▧ عکس</button>
  <button class="secondary" onclick="voice()">🎙 صدا</button>
  <button class="secondary" onclick="webSearch()">🌐 وب</button>
  <button class="secondary" onclick="document.getElementById('textFile').click()">▱ فایل</button>
  <span id="modeLabel" style="font-size:11px;color:var(--gold2)">حالت چت</span>
  <button class="gold send" id="send" onclick="sendMessage()">ارسال ➤</button>
 </div>
</section>

</main>

<aside class="panel right">
 <h3 style="color:var(--gold2)">ابزارهای Nexus ✦</h3>
 <button class="toolcard" onclick="setMode('image')"><span class="ico">🎨</span><span><b>تولید تصویر</b><small>درخواست ساخت تصویر</small></span></button>
 <button class="toolcard" onclick="setMode('code')"><span class="ico">⌨️</span><span><b>برنامه‌نویسی</b><small>کمک در نوشتن کد</small></span></button>
 <button class="toolcard" onclick="setMode('study')"><span class="ico">📚</span><span><b>حالت مطالعه</b><small>توضیح قدم‌به‌قدم</small></span></button>
 <button class="toolcard" onclick="webSearch()"><span class="ico">🌐</span><span><b>جست‌وجوی وب</b><small>جست‌وجوی آنلاین</small></span></button>
 <button class="toolcard" onclick="voice()"><span class="ico">🎙️</span><span><b>ورودی صوتی</b><small>تشخیص گفتار فارسی</small></span></button>
 <button class="toolcard" onclick="fullScreen()"><span class="ico">⛶</span><span><b>تمام صفحه</b><small>نمایش بزرگ‌تر</small></span></button>
 <div class="foot">Nexus1 AI</div>
</aside>

</div>

<script>
const $ = id => document.getElementById(id);

let modeNow = 'chat';
let imageData = null;
let active = null;
let chats = [];
let deferredInstallPrompt = null;

try {
 chats = JSON.parse(localStorage.getItem('nexus1_chats') || '[]');
 if (!Array.isArray(chats)) chats = [];
} catch {
 chats = [];
}
  function persist(){
 try{
  localStorage.setItem('nexus1_chats',JSON.stringify(chats));
 }catch{
  alert('فضای ذخیره‌سازی مرورگر پر شده است.');
 }
}

function current(){
 return chats.find(c => c.id === active);
}

function ensure(title){
 let c = current();
 if(!c){
  c = {
   id:String(Date.now()) + Math.random(),
   title:(title || 'گفتگوی جدید').slice(0,35),
   items:[],
   time:Date.now()
  };
  chats.unshift(c);
  active = c.id;
 }
 return c;
}

function saveItem(role,text,img=null,sources=[]){
 const c = ensure(text);
 c.items.push({role,text,img,sources});
 c.time = Date.now();

 if(role === 'user' && c.items.filter(x => x.role === 'user').length === 1){
  c.title = (text || 'گفتگوی تصویری').slice(0,35);
 }

 persist();
 drawHistory();
}

function drawHistory(){
 const box = $('history');
 box.replaceChildren();
 const q = $('historySearch').value.toLowerCase();

 [...chats].sort((a,b) => b.time-a.time)
 .filter(c => (c.title || '').toLowerCase().includes(q))
 .forEach(c => {
  const row = document.createElement('div');
  row.className = 'hist';

  const open = document.createElement('button');
  open.className = 'open';
  open.textContent = '▣ ' + c.title;
  open.onclick = () => openChat(c.id);

  const del = document.createElement('button');
  del.textContent = '🗑';
  del.onclick = () => {
   if(!confirm('این گفتگو حذف شود؟')) return;
   chats = chats.filter(x => x.id !== c.id);
   if(active === c.id) newChat();
   persist();
   drawHistory();
  };

  row.append(open,del);
  box.append(row);
 });
}

function newChat(){
 active = null;
 $('messages').replaceChildren();

 const h = document.createElement('div');
 h.className = 'hint';
 h.id = 'hint';
 h.textContent = 'گفتگوی جدید را شروع کن ✨';

 $('messages').append(h);
 $('hero').style.display = '';
 $('message').value = '';
 removeImage();
 $('sidebar').classList.remove('open');
}

function openChat(id){
 const c = chats.find(x => x.id === id);
 if(!c) return;

 active = id;
 $('messages').replaceChildren();
 $('hero').style.display = 'none';

 c.items.forEach(m => addMessage(m.role,m.text,m.img,m.sources,false));
 $('sidebar').classList.remove('open');
}

function addMessage(role,text,img=null,sources=[],save=true){
 $('hint')?.remove();
 $('hero').style.display = 'none';

 const row = document.createElement('div');
 row.className = 'msg ' + role;

 const av = document.createElement('div');
 av.className = 'avatar';
 av.textContent = role === 'user' ? 'شما' : 'AI';

 const bubble = document.createElement('div');
 bubble.className = 'bubble';
 bubble.textContent = text || '';

 if(img){
  const im = document.createElement('img');
  im.src = img;
  im.alt = 'تصویر ارسال‌شده';
  bubble.append(im);
 }

 if(Array.isArray(sources) && sources.length){
  const box = document.createElement('div');
  box.className = 'sources';

  sources.forEach(s => {
   try{
    const u = new URL(s.url);
    if(!['http:','https:'].includes(u.protocol)) return;

    const a = document.createElement('a');
    a.href = u.href;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = s.title || u.hostname;
    box.append(a);
   }catch{}
  });

  bubble.append(box);
 }

 row.append(av,bubble);
 $('messages').append(row);

 if(save) saveItem(role,text,img,sources);

 $('messages').scrollTop = $('messages').scrollHeight;
 return bubble;
}

function setMode(m){
 modeNow = m;

 const names = {
  chat:'حالت چت',
  study:'حالت مطالعه',
  image:'تولید تصویر',
  code:'برنامه‌نویسی',
  web:'جست‌وجوی وب'
 };

 $('modeLabel').textContent = names[m] || names.chat;

 document.querySelectorAll('[data-mode]').forEach(b => {
  b.classList.toggle('active',b.dataset.mode === m);
 });

 const placeholders = {
  chat:'پیامت رو بنویس...',
  study:'سؤال درسی‌ات رو بنویس...',
  image:'توضیح بده چه تصویری می‌خوای...',
  code:'سؤال برنامه‌نویسی‌ات رو بنویس...',
  web:'موضوع جست‌وجو رو بنویس...'
 };

 $('message').placeholder = placeholders[m] || placeholders.chat;
 $('message').focus();
}
  function webSearch(){
 setMode('web');
 $('message').value = 'در وب جست‌وجو کن و منابع را ارائه بده: ';
 $('message').focus();
}

function enterSend(e){
 if(e.key === 'Enter' && !e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
}

async function sendMessage(){
 let text = $('message').value.trim();
 const im = imageData;

 if(!text && !im) return;

 const prefixes = {
  study:'در حالت مطالعه، قدم‌به‌قدم و ساده توضیح بده:\n',
  code:'در نقش دستیار برنامه‌نویسی کمک کن:\n',
  web:'این درخواست را با جست‌وجوی وب و ذکر منابع پاسخ بده:\n',
  image:'درخواست من درباره تصویر است. اگر سرویس تولید تصویر در سرور فعال نیست، صادقانه اعلام کن:\n'
 };

 if(prefixes[modeNow]) text = prefixes[modeNow] + text;

 let userText = text;
 if(!userText) userText = 'لطفاً این تصویر را بررسی کن.';

 const preview = im ? im.preview : null;
 addMessage('user',userText,preview);

 $('message').value = '';
 removeImage();

 const wait = addMessage('assistant','در حال دریافت پاسخ...');
 $('send').disabled = true;

 try{
  const response = await fetch('/api/chat',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({
    message:text,
    image:im ? {mimeType:im.mimeType,data:im.data} : null
   })
  });

  const data = await response.json();

  if(!response.ok){
   throw new Error(data.error || 'خطا در ارتباط با سرور');
  }

  const reply = data.reply || 'پاسخی دریافت نشد.';
  wait.textContent = reply;

  const sources = Array.isArray(data.sources) ? data.sources : [];

  if(sources.length){
   const box = document.createElement('div');
   box.className = 'sources';

   sources.forEach(s => {
    try{
     const u = new URL(s.url);
     if(!['http:','https:'].includes(u.protocol)) return;

     const a = document.createElement('a');
     a.href = u.href;
     a.target = '_blank';
     a.rel = 'noopener noreferrer';
     a.textContent = s.title || u.hostname;
     box.append(a);
    }catch{}
   });

   wait.append(box);
  }

  const c = current();
  const last = c?.items[c.items.length-1];

  if(last?.role === 'assistant' && last.text === 'در حال دریافت پاسخ...'){
   last.text = reply;
   last.sources = sources;
   persist();
  }

 }catch(e){
  wait.textContent = 'خطا: ' + e.message;

  const c = current();
  const last = c?.items[c.items.length-1];

  if(last?.role === 'assistant'){
   last.text = 'خطا: ' + e.message;
   persist();
  }

 }finally{
  $('send').disabled = false;
 }
}

function pickImage(e){
 const f = e.target.files[0];
 if(!f) return;

 if(!['image/jpeg','image/png','image/webp'].includes(f.type) || f.size > 5*1024*1024){
  alert('فقط JPG، PNG یا WEBP تا ۵ مگابایت مجاز است.');
  e.target.value = '';
  return;
 }

 const reader = new FileReader();

 reader.onload = () => {
  imageData = {
   mimeType:f.type,
   data:reader.result.split(',')[1],
   preview:reader.result
  };

  $('previewImg').src = reader.result;
  $('preview').style.display = 'block';
 };

 reader.readAsDataURL(f);
}

function removeImage(){
 imageData = null;
 $('imageFile').value = '';
 $('preview').style.display = 'none';
}

function pickTextFile(e){
 const f = e.target.files[0];
 if(!f) return;

 if(f.size > 500000){
  alert('فایل باید کمتر از ۵۰۰ کیلوبایت باشد.');
  e.target.value = '';
  return;
 }

 const reader = new FileReader();

 reader.onload = () => {
  $('message').value += '\n\nمحتوای فایل ' + f.name + ':\n' + reader.result;
  $('message').focus();
 };

 reader.readAsText(f);
 e.target.value = '';
}

function voice(){
 const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

 if(!SR){
  alert('این مرورگر تشخیص گفتار را پشتیبانی نمی‌کند. Chrome را امتحان کن.');
  return;
 }

 const rec = new SR();
 rec.lang = 'fa-IR';
 rec.interimResults = false;

 rec.onresult = e => {
  $('message').value = ($('message').value + ' ' + e.results[0][0].transcript).trim();
  $('message').focus();
 };

 rec.onerror = () => alert('میکروفون فعال نشد. اجازه دسترسی مرورگر را بررسی کن.');
 rec.start();
}

function toggleMenu(){
 $('sidebar').classList.toggle('open');
}
  function fullScreen(){
 if(!document.fullscreenElement){
  document.documentElement.requestFullscreen?.();
 }else{
  document.exitFullscreen?.();
 }
}

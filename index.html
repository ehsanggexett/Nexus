<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusAI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #090b10;
      color: #fff;
      font-family: Tahoma, Arial, sans-serif;
      min-height: 100vh;
    }
    .app { display: flex; min-height: 100vh; }
    aside {
      width: 250px;
      background: #10131c;
      border-left: 1px solid #252a36;
      padding: 25px 16px;
    }
    .logo { font-size: 25px; font-weight: bold; margin-bottom: 40px; }
    .logo span { color: #8b7cff; }
    .menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    button {
      cursor: pointer;
      border: 1px solid #292e3b;
      background: #191e2a;
      color: white;
      padding: 15px;
      border-radius: 12px;
      font-size: 14px;
      text-align: right;
    }
    button:hover, button.active {
      background: #292443;
      border-color: #8170ff;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 35px 20px;
    }
    .welcome { text-align: center; margin-top: 12vh; }
    h1 { font-size: 38px; }
    h1 span { color: #9384ff; }
    .subtitle { color: #9299aa; }
    .tools {
      display: grid;
      grid-template-columns: repeat(2, minmax(130px, 190px));
      gap: 14px;
      margin-top: 35px;
    }
    .tools button { text-align: center; padding: 24px 10px; }
    .chat {
      width: min(700px, 100%);
      margin-top: auto;
      padding-top: 45px;
    }
    .input {
      display: flex;
      gap: 10px;
      background: #151a25;
      padding: 10px;
      border: 1px solid #303647;
      border-radius: 16px;
    }
    input {
      flex: 1;
      min-width: 0;
      background: transparent;
      color: white;
      border: 0;
      outline: 0;
      padding: 10px;
      font-size: 15px;
    }
    .send { background: #7564ed; border: 0; }
    #status { color: #a9a1ff; text-align: center; }
    @media(max-width:650px) {
      aside { width: 125px; padding: 15px 8px; }
      .logo { font-size: 19px; }
      button { font-size: 12px; padding: 12px 7px; }
      h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="logo">Nexus<span>AI</span></div>
    <div class="menu">
      <button class="active" onclick="choose('دستیار هوشمند')">💬 چت هوشمند</button>
      <button onclick="choose('حالت درس')">🎓 حالت درس</button>
      <button onclick="choose('عکس‌سازی')">🎨 عکس‌سازی</button>
      <button onclick="choose('گفت‌وگوی صوتی')">🎙 گفت‌وگوی صوتی</button>
      <button onclick="choose('برنامه‌نویسی')">💻 برنامه‌نویسی</button>
    </div>
  </aside>
  <main>
    <section class="welcome">
      <h1>به <span>NexusAI</span> خوش آمدی</h1>
      <p class="subtitle">دستیار هوشمند چندمنظوره تو</p>
      <div class="tools">
        <button onclick="choose('حالت درس')">🎓<br><br>حالت درس</button>
        <button onclick="choose('عکس‌سازی')">🎨<br><br>عکس‌سازی</button>
        <button onclick="choose('گفت‌وگوی صوتی')">🎙<br><br>گفت‌وگوی صوتی</button>
        <button onclick="choose('برنامه‌نویسی')">💻<br><br>برنامه‌نویسی</button>
      </div>
    </section>
    <section class="chat">
      <p id="status">دستیار هوشمند انتخاب شده است</p>
      <div class="input">
        <input id="message" placeholder="پیامت را اینجا بنویس...">
        <button class="send" onclick="sendMessage()">ارسال ↑</button>
      </div>
    </section>
  </main>
</div>
<script>
  let currentMode = "دستیار هوشمند";

  function choose(mode) {
    currentMode = mode;
    document.getElementById("status").textContent =
      "حالت انتخاب‌شده: " + mode;
  }

  function sendMessage() {
    const input = document.getElementById("message");
    if (!input.value.trim()) return;
    document.getElementById("status").textContent =
      "پیام دریافت شد؛ اتصال هوش مصنوعی در مراحل بعدی اضافه می‌شود.";
    input.value = "";
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus1 AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b12;color:#f5f6fb;font-family:Tahoma,Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:flex}
aside{width:245px;flex-shrink:0;background:#101420;border-left:1px solid #293044;padding:22px 15px;display:flex;flex-direction:column}
.brand{font-size:23px;font-weight:bold;padding:10px;margin-bottom:25px}
.brand span{color:#9685ff}
.side-label{font-size:11px;color:#778198;margin:10px}
.menu{display:grid;gap:8px}
.menu button{background:transparent;color:#d5d9e5;border:1px solid transparent;padding:13px;border-radius:12px;text-align:right}
.menu button:hover,.menu button.active{background:#24213c;border-color:#51468a}
.side-bottom{margin-top:auto;color:#929bb0;font-size:12px;padding:12px}
.side-bottom strong{color:#a99aff}
main{flex:1;min-width:0;padding:22px;display:flex;flex-direction:column;align-items:center}
.topbar{width:min(950px,100%);text-align:left;color:#aab3c5;font-size:12px}
.welcome{width:min(850px,100%);text-align:center;margin:7vh auto 25px}
.welcome h1{font-size:38px}
.welcome h1 span{color:#a99aff}
.subtitle{color:#929bb0;font-size:14px;line-height:2}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:30px auto;width:min(780px,100%)}
.tool{background:#171d2c;border:1px solid #30394d;border-radius:15px;color:white;padding:20px 8px;min-height:105px}
.tool:hover{border-color:#8875ff}
.tool-icon{display:block;font-size:24px;margin-bottom:10px}
.tool-title{font-size:12px;font-weight:bold}
.tool-desc{display:block;color:#929bb0;font-size:10px;margin-top:8px}
.chat{width:min(900px,100%);margin:auto auto 0}
#status{text-align:center;color:#a99aff;font-size:12px;min-height:22px}
#messages{display:flex;flex-direction:column;gap:12px;max-height:42vh;overflow-y:auto;padding:10px}
.message{padding:13px 16px;border-radius:14px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
.message.user{align-self:flex-start;background:#302a55;max-width:90%}
.message.ai{align-self:stretch;background:#151b29;border:1px solid #30394d}
.message-image{display:block;max-width:280px;max-height:230px;object-fit:contain;border-radius:10px;margin-bottom:8px}
.composer{background:#151b29;border:1px solid #343d52;border-radius:18px;padding:10px}
.compose-row{display:flex;align-items:center;gap:7px}
#message{flex:1;min-width:0;background:transparent;border:0;outline:0;color:white;padding:12px;font-size:13px}
#message::placeholder{color:#778198}
.icon-button{height:40px;min-width:40px;border-radius:11px;border:1px solid #343d52;background:#222a3b;color:white}
.icon-button:hover{border-color:#8875ff}
#voiceChatButton{padding:0 12px;background:#282344;border-color:#6556b5;white-space:nowrap;font-size:12px}
#voiceChatButton.active{background:#174333;border-color:#55d69a;color:#baffdc}
.send{height:40px;padding:0 16px;border:0;border-radius:11px;background:#7966ed;color:white}
#imageInput{display:none}
.preview-wrap{display:none;align-items:center;gap:10px;padding:8px}
.preview-wrap.show{display:flex}
.preview-wrap img{width:55px;height:55px;object-fit:cover;border-radius:8px}
.preview-info{flex:1;font-size:11px;color:#aeb7c9}
.remove-image{background:#292f40;color:white;border:0;border-radius:8px;padding:8px}
.hint{text-align:center;color:#758098;font-size:10px;margin:10px}
@media(max-width:760px){
 aside{width:65px;padding:15px 6px}
 .brand{font-size:16px;padding:5px 0;text-align:center}
 .brand small,.side-label,.menu-text,.side-bottom{display:none}
 .menu button{text-align:center;padding:12px 3px;font-size:17px}
 main{padding:14px 10px}
 .welcome{margin-top:5vh}
  .welcome h1{font-size:27px}
 .tools{grid-template-columns:repeat(2,1fr);gap:8px}
 .tool{min-height:95px}
 #messages{max-height:38vh}
}
@media(max-width:430px){
 .compose-row{gap:5px}
 #voiceChatButton{width:40px;min-width:40px;padding:0;font-size:0}
 #voiceChatButton:after{content:"🔊";font-size:17px}
 .icon-button{width:36px;min-width:36px}
 .send{padding:0 9px}
}
</style>
</head>
<body>
<div class="app">
<aside>
 <div class="brand">Nexus1 <span>AI</span><br><small style="font-size:10px;color:#929bb0">دستیار هوشمند</small></div>
 <div class="side-label">فضای کاری</div>
 <nav class="menu">
  <button class="active" data-mode="دستیار هوشمند" onclick="choose('دستیار هوشمند',this)">✦ <span class="menu-text">چت هوشمند</span></button>
  <button data-mode="حالت درس" onclick="choose('حالت درس',this)">📚 <span class="menu-text">حالت درس</span></button>
  <button data-mode="عکس‌سازی" onclick="choose('عکس‌سازی',this)">🖼 <span class="menu-text">ابزار تصویر</span></button>
  <button data-mode="برنامه‌نویسی" onclick="choose('برنامه‌نویسی',this)">⌘ <span class="menu-text">برنامه‌نویسی</span></button>
 </nav>
 <div class="side-bottom">ساخته شده توسط<br><strong>ehsanGGExE</strong></div>
</aside>

<main>
 <div class="topbar">● دستیار آماده گفتگو</div>

 <section class="welcome" id="welcome">
  <h1>به <span>Nexus1 AI</span> خوش آمدی</h1>
  <p class="subtitle">ایده‌هایت را مطرح کن؛ برای یادگیری، برنامه‌نویسی و گفتگو کنارت هستم.</p>
  <div class="tools">
   <button class="tool" onclick="choose('حالت درس')"><span class="tool-icon">📚</span><span class="tool-title">حالت درس</span><span class="tool-desc">یادگیری و توضیح</span></button>
   <button class="tool" onclick="choose('عکس‌سازی')"><span class="tool-icon">🖼</span><span class="tool-title">ابزار تصویر</span><span class="tool-desc">بررسی عکس</span></button>
   <button class="tool" onclick="toggleVoiceChat()"><span class="tool-icon">🔊</span><span class="tool-title">گفت‌وگوی صوتی</span><span class="tool-desc">صحبت با هوش مصنوعی</span></button>
   <button class="tool" onclick="choose('برنامه‌نویسی')"><span class="tool-icon">⌘</span><span class="tool-title">برنامه‌نویسی</span><span class="tool-desc">کمک در نوشتن کد</span></button>
  </div>
 </section>

 <section class="chat">
  <p id="status">Nexus1 AI آماده پاسخ‌گویی است</p>
  <div id="messages"></div>
  <div class="composer">
   <div class="preview-wrap" id="previewWrap">
    <img id="imagePreview" alt="پیش‌نمایش عکس">
    <span class="preview-info" id="previewInfo"></span>
    <button class="remove-image" onclick="removeImage()">حذف</button>
   </div>
   <div class="compose-row">
    <input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
    <button class="icon-button" title="انتخاب عکس" onclick="document.getElementById('imageInput').click()">＋</button>
    <button class="icon-button" id="micButton" title="میکروفون معمولی" onclick="startVoice()">🎙</button>
    <button class="icon-button" id="voiceChatButton" title="گفت‌وگوی صوتی" onclick="toggleVoiceChat()">🔊 گفت‌وگوی صوتی</button>
    <input id="message" type="text" placeholder="پیامت را برای Nexus1 AI بنویس..." autocomplete="off">
    <button class="send" id="sendButton" onclick="sendMessage()">ارسال ↑</button>
   </div>
  </div>
  <div class="hint">＋ انتخاب عکس · 🎙 میکروفون معمولی · 🔊 گفت‌وگوی صوتی دوطرفه</div>
 </section>
</main>
</div>

<script>
"use strict";

let currentMode="دستیار هوشمند";
let isSending=false;
let selectedImage=null;
let recognition=null;
let isListening=false;
let voiceChatActive=false;
let voiceTurnRecognition=null;
let voiceRestartTimer=null;

const input=document.getElementById("message");
const statusText=document.getElementById("status");
const messages=document.getElementById("messages");
const sendButton=document.getElementById("sendButton");
  const imageInput=document.getElementById("imageInput");
const previewWrap=document.getElementById("previewWrap");
const imagePreview=document.getElementById("imagePreview");
const previewInfo=document.getElementById("previewInfo");
const voiceChatButton=document.getElementById("voiceChatButton");
const micButton=document.getElementById("micButton");

function choose(mode,button){
 currentMode=mode;
 document.querySelectorAll(".menu button").forEach(b=>b.classList.remove("active"));
 const target=button||document.querySelector('.menu button[data-mode="'+mode+'"]');
 if(target)target.classList.add("active");
 statusText.textContent="حالت "+mode+" انتخاب شد.";
}

function getModeInstruction(){
 if(currentMode==="حالت درس")return "مثل یک معلم صبور، مطالب را ساده و مرحله‌به‌مرحله توضیح بده.\n\n";
 if(currentMode==="برنامه‌نویسی")return "مثل یک برنامه‌نویس حرفه‌ای پاسخ بده و کد دقیق ارائه کن.\n\n";
 if(currentMode==="عکس‌سازی")return "تصویر ارسالی را با دقت بررسی کن و به درخواست کاربر پاسخ بده.\n\n";
 return "";
}

function addMessage(text,type,imageUrl){
 const msg=document.createElement("div");
 msg.className="message "+type;
 if(imageUrl){
  const img=document.createElement("img");
  img.src=imageUrl;
  img.alt="تصویر ارسالی";
  img.className="message-image";
  msg.appendChild(img);
 }
 if(text){
  const content=document.createElement("div");
  content.textContent=text;
  msg.appendChild(content);
 }
 messages.appendChild(msg);
 messages.scrollTop=messages.scrollHeight;
}

imageInput.addEventListener("change",function(){
 const file=imageInput.files&&imageInput.files[0];
 if(!file)return;
 if(!["image/jpeg","image/png","image/webp","image/gif"].includes(file.type)){
  statusText.textContent="فرمت عکس پشتیبانی نمی‌شود.";
  imageInput.value="";
  return;
 }
 if(file.size>5*1024*1024){
  statusText.textContent="حجم عکس باید حداکثر ۵ مگابایت باشد.";
  imageInput.value="";
  return;
 }
 const reader=new FileReader();
 reader.onload=function(event){
  selectedImage={mimeType:file.type,data:event.target.result};
  imagePreview.src=event.target.result;
  previewInfo.textContent=file.name;
  previewWrap.classList.add("show");
  choose("عکس‌سازی");
  statusText.textContent="عکس آماده ارسال است.";
 };
 reader.onerror=()=>statusText.textContent="خواندن عکس با خطا مواجه شد.";
 reader.readAsDataURL(file);
});

function removeImage(){
 selectedImage=null;
 imageInput.value="";
 imagePreview.removeAttribute("src");
 previewWrap.classList.remove("show");
 statusText.textContent="عکس حذف شد.";
}

async function sendMessage(options={}){
 const userMessage=input.value.trim();
 if((!userMessage&&!selectedImage)||isSending)return;

 const fromVoice=options.fromVoice===true;
 isSending=true;
 sendButton.disabled=true;

 const imageData=selectedImage?selectedImage.data:null;
 addMessage(userMessage||"لطفاً این عکس را بررسی کن.","user",imageData);
 input.value="";
 selectedImage=null;
 imageInput.value="";
 previewWrap.classList.remove("show");
 document.getElementById("welcome").style.display="none";
 statusText.textContent="Nexus1 AI در حال فکر کردن است...";

 const payload={message:getModeInstruction()+userMessage};
 if(imageData){
  payload.image={
   mimeType:imageData.substring(5,imageData.indexOf(";")),
   data:imageData
  };
 }

 try{
  const response=await fetch("/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify(payload)
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"خطا در دریافت پاسخ");

  const reply=data.reply||"پاسخی دریافت نشد.";
  addMessage(reply,"ai");
  statusText.textContent="پاسخ دریافت شد";
  if(fromVoice&&voiceChatActive)speakVoiceReply(reply);
 }catch(error){
  addMessage("ارتباط با هوش مصنوعی برقرار نشد.\n"+error.message,"ai");
  statusText.textContent="خطا در ارتباط با سرور";
  if(fromVoice&&voiceChatActive)scheduleVoiceListen(1200);
 }finally{
  isSending=false;
  sendButton.disabled=false;
  if(!voiceChatActive)input.focus();
 }
}
// پخش صوتی پاسخ هوش مصنوعی
function speakVoiceReply(text){
 if(!("speechSynthesis" in window)){
  statusText.textContent="پخش صدا در این مرورگر پشتیبانی نمی‌شود.";
  stopVoiceChat();
  return;
 }
 window.speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="fa-IR";
 utterance.rate=1;
 utterance.onstart=()=>statusText.textContent="Nexus1 AI در حال صحبت است...";
 utterance.onend=()=>{if(voiceChatActive)scheduleVoiceListen(500);};
 utterance.onerror=()=>{if(voiceChatActive)scheduleVoiceListen(1000);};
 window.speechSynthesis.speak(utterance);
}

function toggleVoiceChat(){
 if(voiceChatActive){stopVoiceChat();return;}
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){
  statusText.textContent="تشخیص گفتار پشتیبانی نمی‌شود؛ Chrome را امتحان کن.";
  return;
 }
 if(!("speechSynthesis" in window)){
  statusText.textContent="پخش صدا در این مرورگر پشتیبانی نمی‌شود.";
  return;
 }
 voiceChatActive=true;
 voiceChatButton.classList.add("active");
 voiceChatButton.textContent="⏹ توقف گفتگو";
 voiceChatButton.setAttribute("aria-pressed","true");
 statusText.textContent="گفت‌وگوی صوتی روشن شد؛ صحبت کن.";
 listenForVoiceTurn();
}

function stopVoiceChat(){
 voiceChatActive=false;
 clearTimeout(voiceRestartTimer);
 if(voiceTurnRecognition){
  try{voiceTurnRecognition.abort();}catch(e){}
  voiceTurnRecognition=null;
 }
 if("speechSynthesis" in window)window.speechSynthesis.cancel();
 voiceChatButton.classList.remove("active");
 voiceChatButton.textContent="🔊 گفت‌وگوی صوتی";
 voiceChatButton.setAttribute("aria-pressed","false");
 isListening=false;
 statusText.textContent="گفت‌وگوی صوتی متوقف شد.";
}

function scheduleVoiceListen(delay){
 clearTimeout(voiceRestartTimer);
 if(!voiceChatActive)return;
 voiceRestartTimer=setTimeout(()=>{
  if(voiceChatActive&&!isSending&&!isListening)listenForVoiceTurn();
 },delay);
}

function listenForVoiceTurn(){
 if(!voiceChatActive⠵⠺⠵⠞⠵⠺⠞⠞⠵isListening)return;
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){stopVoiceChat();return;}

 const rec=new SR();
 voiceTurnRecognition=rec;
 rec.lang="fa-IR";
 rec.continuous=false;
 rec.interimResults=false;

 rec.onstart=()=>{
  isListening=true;
  statusText.textContent="گوش می‌دهم... صحبت کن.";
 };

 rec.onresult=event=>{
  if(!voiceChatActive)return;
  const spoken=event.results[0][0].transcript.trim();
  isListening=false;
  try{rec.stop();}catch(e){}
  if(spoken){
   input.value=spoken;
   sendMessage({fromVoice:true});
  }else{
   scheduleVoiceListen(500);
  }
 };

 rec.onerror=event=>{
  isListening=false;
  if(!voiceChatActive)return;
  if(event.error==="not-allowed"||event.error==="service-not-allowed"){
   statusText.textContent="اجازه میکروفون داده نشده؛ مجوز سایت را فعال کن.";
   stopVoiceChat();
  }else if(event.error!=="aborted"&&event.error!=="no-speech"){
   statusText.textContent="خطای میکروفون: "+event.error;
   scheduleVoiceListen(1200);
  }
 };

 rec.onend=()=>{
  isListening=false;
  if(voiceTurnRecognition===rec)voiceTurnRecognition=null;
  if(voiceChatActive&&!isSending&&!window.speechSynthesis.speaking){
   scheduleVoiceListen(700);
  }
 };

 try{rec.start();}
 catch(error){
  isListening=false;
  statusText.textContent="شروع میکروفون ممکن نشد؛ دوباره دکمه را بزن.";
 }
}

// میکروفون معمولی قبلی؛ مستقل از گفت‌وگوی صوتی
function startVoice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){
  statusText.textContent="تشخیص گفتار پشتیبانی نمی‌شود؛ از Chrome استفاده کن.";
  return;
 }
 if(isListening&&recognition){
  try{recognition.stop();}catch(e){}
  return;
 }

 recognition=new SR();
 recognition.lang="fa-IR";
 recognition.continuous=false;
 recognition.interimResults=false;

 recognition.onstart=()=>{
  isListening=true;
   micButton.textContent="⏹";
  statusText.textContent="در حال گوش دادن... صحبت کن.";
 };
 recognition.onresult=event=>{
  input.value=event.results[0][0].transcript;
  statusText.textContent="صدایت دریافت شد؛ در حال ارسال...";
  sendMessage();
 };
 recognition.onerror=()=>{
  statusText.textContent="دسترسی میکروفون یا تشخیص گفتار با مشکل مواجه شد.";
 };
 recognition.onend=()=>{
  isListening=false;
  micButton.textContent="🎙";
 };
 try{recognition.start();}
 catch(error){statusText.textContent="شروع میکروفون ممکن نشد. دوباره تلاش کن.";}
}

input.addEventListener("keydown",event=>{
 if(event.key==="Enter")sendMessage();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b10">
  <title>Siman AI | هوش مصنوعی سیمان</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #090b10;
      color: #fff;
      font-family: Tahoma, Arial, sans-serif;
      min-height: 100vh;
    }

    button, input { font-family: inherit; }

    .app {
      display: flex;
      min-height: 100vh;
    }

    aside {
      width: 250px;
      flex-shrink: 0;
      background: #10131c;
      border-left: 1px solid #252a36;
      padding: 25px 16px;
    }

    .logo {
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .logo span { color: #8b7cff; }

    .brand-description {
      color: #858da0;
      font-size: 12px;
      margin-bottom: 38px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      cursor: pointer;
      border: 1px solid #292e3b;
      background: #191e2a;
      color: white;
      padding: 15px;
      border-radius: 12px;
      font-size: 14px;
      text-align: right;
      transition: 0.2s;
    }

    button:hover, button.active {
      background: #292443;
      border-color: #8170ff;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }

    .welcome {
      text-align: center;
      margin-top: 7vh;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    h1 span { color: #9384ff; }

    .subtitle {
      color: #9299aa;
      font-size: 15px;
    }

    .tools {
      display: grid;
      grid-template-columns: repeat(2, minmax(130px, 190px));
      gap: 14px;
      margin-top: 35px;
    }

    .tools button {
      text-align: center;
      padding: 24px 10px;
      font-size: 15px;
    }

    .tool-icon {
      font-size: 27px;
    }

    .tool-state {
      display: block;
      margin-top: 12px;
      color: #9d92ff;
      font-size: 11px;
    }

    .chat {
      width: min(750px, 100%);
      margin-top: auto;
      padding-top: 35px;
    }

    #status {
      color: #a9a1ff;
      text-align: center;
      min-height: 22px;
      font-size: 13px;
    }

    #messages {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 18px;
      max-height: 45vh;
      overflow-y: auto;
      padding: 5px;
    }

    .message {
      padding: 14px 16px;
      border-radius: 14px;
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      background: #292443;
      align-self: flex-start;
      max-width: 90%;
    }

    .ai {
      background: #151a25;
      border: 1px solid #303647;
      align-self: stretch;
    }

    .input {
      display: flex;
      gap: 10px;
      background: #151a25;
      padding: 10px;
      border: 1px solid #303647;
      border-radius: 16px;
    }

    input {
      flex: 1;
      min-width: 0;
      background: transparent;
      color: white;
      border: 0;
      outline: 0;
      padding: 10px;
      font-size: 15px;
    }

    .send {
      background: #7564ed;
      border: 0;
      text-align: center;
    }

    .send:hover { background: #6553dd; }

    .footer {
      color: #666e80;
      font-size: 11px;
      text-align: center;
      margin-top: 15px;
    }

    @media(max-width:650px) {
      aside {
        width: 125px;
        padding: 15px 8px;
      }

      .logo { font-size: 19px; }
      .brand-description { font-size: 10px; }

      button {
        font-size: 12px;
        padding: 12px 7px;
      }

      h1 { font-size: 27px; }
      .subtitle { font-size: 12px; }
      .tools { grid-template-columns: repeat(2, minmax(110px, 1fr)); }
    }
  </style>
</head>

<body>

<div class="app">
  <aside>
    <div class="logo">Siman <span>AI</span></div>
    <div class="brand-description">هوش مصنوعی سیمان</div>

    <div class="menu">
      <button class="active" onclick="choose('دستیار هوشمند', this)">
        💬 چت هوشمند
      </button>

      <button onclick="choose('حالت درس', this)">
        🎓 حالت درس
      </button>

      <button onclick="choose('عکس‌سازی', this)">
        🎨 عکس‌سازی
      </button>

      <button onclick="choose('گفت‌وگوی صوتی', this)">
        🎙 گفت‌وگوی صوتی
      </button>

      <button onclick="choose('برنامه‌نویسی', this)">
        💻 برنامه‌نویسی
      </button>
    </div>
  </aside>

  <main>

    <section class="welcome">
      <h1>به <span>Siman AI</span> خوش آمدی</h1>

      <p class="subtitle">
        هوش مصنوعی سیمان؛ دستیار هوشمند چندمنظوره
      </p>

      <div class="tools">

        <button onclick="chooseFromTool('حالت درس')">
          <span class="tool-icon">🎓</span>
          <br><br>
          حالت درس
          <span class="tool-state">دستیار آموزشی</span>
        </button>

        <button onclick="chooseFromTool('عکس‌سازی')">
          <span class="tool-icon">🎨</span>
          <br><br>
          عکس‌سازی
          <span class="tool-state">در انتظار اتصال</span>
        </button>

        <button onclick="chooseFromTool('گفت‌وگوی صوتی')">
          <span class="tool-icon">🎙</span>
          <br><br>
          گفت‌وگوی صوتی
          <span class="tool-state">در انتظار اتصال</span>
        </button>

        <button onclick="chooseFromTool('برنامه‌نویسی')">
          <span class="tool-icon">💻</span>
          <br><br>
          برنامه‌نویسی
          <span class="tool-state">دستیار کدنویسی</span>
        </button>

      </div>
    </section>

    <section class="chat">

      <p id="status">
        دستیار هوشمند سیمان آماده است
      </p>

      <div id="messages"></div>

      <div class="input">
        <input
          id="message"
          type="text"
          placeholder="پیامت را برای Siman AI بنویس..."
          autocomplete="off"
        >

        <button class="send" id="sendButton" onclick="sendMessage()">
          ارسال ↑
        </button>
      </div>

      <div class="footer">
        Siman AI | هوش مصنوعی سیمان
      </div>

    </section>

  </main>
</div>

<script>
  let currentMode = "دستیار هوشمند";
  let isSending = false;

  const input = document.getElementById("message");
  const statusText = document.getElementById("status");
  const messages = document.getElementById("messages");
  const sendButton = document.getElementById("sendButton");

  function choose(mode, button) {
    currentMode = mode;

    document.querySelectorAll(".menu button").forEach(btn => {
      btn.classList.remove("active");
    });

    if (button) {
      button.classList.add("active");
    } else {
      document.querySelectorAll(".menu button").forEach(btn => {
        if (btn.textContent.includes(mode)) {
          btn.classList.add("active");
        }
      });
    }

    statusText.textContent = "حالت انتخاب‌شده: " + mode;

    if (mode === "عکس‌سازی") {
      input.placeholder = "توضیحات تصویر موردنظرت را بنویس...";
    } else if (mode === "گفت‌وگوی صوتی") {
      input.placeholder = "گفت‌وگوی صوتی هنوز فعال نشده است...";
    } else if (mode === "برنامه‌نویسی") {
      input.placeholder = "سؤال برنامه‌نویسی خود را بنویس...";
    } else if (mode === "حالت درس") {
      input.placeholder = "سؤال درسی خود را بنویس...";
    } else {
      input.placeholder = "پیامت را برای Siman AI بنویس...";
    }
  }

  function chooseFromTool(mode) {
    choose(mode);
  }

  function addMessage(text, type) {
    const message = document.createElement("div");
    message.className = "message " + type;
    message.textContent = text;

    messages.appendChild(message);

    message.scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });
  }

  function getModeInstruction() {
    switch (currentMode) {
      case "حالت درس":
        return "در نقش یک معلم صبور عمل کن. مطالب را ساده و مرحله به مرحله توضیح بده.\n\n";
case "برنامه‌نویسی":
        return "در نقش یک برنامه نویس حرفه‌ای عمل کن. کدها را دقیق بنویس و مراحل را ساده توضیح بده.\n\n";

      case "عکس‌سازی":
        return "در نقش یک متخصص طراحی تصویر عمل کن و برای ساخت تصاویر، پرامپت‌های دقیق و حرفه‌ای پیشنهاد بده. توجه کن که تولید مستقیم تصویر هنوز فعال نیست.\n\n";

      default:
        return "";
    }
  }

  async function sendMessage() {
    const userMessage = input.value.trim();

    if (!userMessage || isSending) return;

    if (currentMode === "گفت‌وگوی صوتی") {
      statusText.textContent =
        "قابلیت گفت‌وگوی صوتی هنوز فعال نشده است.";
      return;
    }

    if (currentMode === "عکس‌سازی") {
      statusText.textContent =
        "قابلیت تولید و ویرایش تصویر هنوز به سرویس تصویر متصل نشده است.";
      return;
    }

    isSending = true;
    sendButton.disabled = true;

    addMessage(userMessage, "user");
    input.value = "";

    statusText.textContent = "Siman AI در حال فکر کردن است...";

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: getModeInstruction() + userMessage
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "خطا در دریافت پاسخ");
      }

      addMessage(data.reply || "پاسخی دریافت نشد.", "ai");

      statusText.textContent = "پاسخ از Siman AI دریافت شد.";

    } catch (error) {
      addMessage(
        "ارتباط با هوش مصنوعی برقرار نشد.\n" + error.message,
        "ai"
      );

      statusText.textContent = "خطا در ارتباط با سرور";
    } finally {
      isSending = false;
      sendButton.disabled = false;
      input.focus();
    }
  }

  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  });
</script>

</body>
</html>
